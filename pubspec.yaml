name: sudosend
description: "SUDOSEND — secure, local, instant file sharing over the Wraith Protocol."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  wraith_core:
    path: packages/wraith_core
  file_picker: ^10.3.9
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#060816"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256

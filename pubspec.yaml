name: sudosend
description: "SUDOSEND — secure, local, instant file sharing over the Wraith Protocol."
publish_to: 'none'
version: 0.10.1+13

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  wraith_core:
    path: packages/wraith_core
  file_picker: ^10.3.9
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  desktop_drop: ^0.7.0
  video_player: ^2.9.2
  pdfrx: ^2.0.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  cryptography: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/developer/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#060816"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256

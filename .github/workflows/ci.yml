name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CREATE_ARGS: --org com.sudosoc --project-name sudosend --platforms android,windows,linux .

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate platform folders
        run: flutter create $CREATE_ARGS
      - name: Custom Android files survived
        run: |
          grep -q CHANGE_WIFI_MULTICAST_STATE android/app/src/main/AndroidManifest.xml
          grep -q acquireMulticastLock android/app/src/main/kotlin/com/sudosoc/sudosend/MainActivity.kt
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create $CREATE_ARGS
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk sudosend-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-android
          path: sudosend-android.apk

  linux:
    name: Linux bundle
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create $CREATE_ARGS
      - run: flutter build linux --release
      - run: tar -czf sudosend-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-linux
          path: sudosend-linux-x64.tar.gz

  windows:
    name: Windows build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.sudosoc --project-name sudosend --platforms android,windows,linux .
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sudosend-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-windows
          path: sudosend-windows-x64.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

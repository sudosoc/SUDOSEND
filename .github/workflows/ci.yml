name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test & CLI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh flutter analyze --no-fatal-infos
      - run: ./tool/ci_run.sh flutter test
      - name: Build CLI
        run: ./tool/ci_run.sh ./tool/build_cli.sh sudosend-cli
      - name: Benchmark (x64)
        run: cd packages/wraith_core && dart compile exe tool/bench.dart -o /tmp/bench && /tmp/bench 512
      - name: CLI end-to-end over loopback (folder + file + resume-safe naming)
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          XDG_CONFIG_HOME=$T/bob ./sudosend-cli id --name ci-bob
          XDG_CONFIG_HOME=$T/bob ./sudosend-cli receive --dir $T/inbox --yes --once > $T/receive.log 2>&1 &
          RX=$!
          sleep 3
          XDG_CONFIG_HOME=$T/alice ./sudosend-cli send README.md lib --to 127.0.0.1
          wait $RX
          cat $T/receive.log
          cmp README.md $T/inbox/README.md
          diff -r lib $T/inbox/lib
          XDG_CONFIG_HOME=$T/bob ./sudosend-cli receive --dir $T/inbox --yes --once > $T/receive2.log 2>&1 &
          RX=$!
          sleep 3
          XDG_CONFIG_HOME=$T/alice ./sudosend-cli send --text "hello from CI 🔐" --to 127.0.0.1
          wait $RX
          grep -q "hello from CI" $T/receive2.log
          echo "CLI E2E passed"

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
      - name: Pre-install NDK
        run: ./tool/install_ndk.sh
      - run: ./tool/ci_run.sh flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk sudosend-android.apk
      - name: Sign with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./tool/sign_apk.sh sudosend-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-android
          path: sudosend-android.apk

  linux:
    name: Linux x64 app + CLI + .deb
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh flutter build linux --release
      - run: ./tool/ci_run.sh ./tool/build_cli.sh sudosend-cli-linux-x64
      - run: ./tool/package_linux.sh build/linux/x64/release/bundle sudosend-cli-linux-x64 x64
      - name: Smoke-test the installer
        run: |
          mkdir -p /tmp/t && tar -xzf dist/sudosend-linux-x64.tar.gz -C /tmp/t
          /tmp/t/sudosend/install.sh --yes
          ~/.local/bin/sudosend id
          ~/.local/bin/sudosend --uninstall
          sudo apt-get install -y ./dist/sudosend_*_amd64.deb
          sudosend id
      - run: cp sudosend-cli-linux-x64 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-linux-x64
          path: dist/*

  linux-arm64:
    name: Linux ARM64 app + CLI + .deb (Raspberry Pi)
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev curl git unzip xz-utils
      - name: Install Flutter (ARM64)
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version && flutter config --no-analytics --enable-linux-desktop
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh flutter build linux --release
      - run: ./tool/ci_run.sh ./tool/build_cli.sh sudosend-cli-linux-arm64
      - name: Benchmark (ARM64)
        run: cd packages/wraith_core && dart compile exe tool/bench.dart -o /tmp/bench && /tmp/bench 512
      - run: ./tool/package_linux.sh build/linux/arm64/release/bundle sudosend-cli-linux-arm64 arm64
      - name: Smoke-test the installer
        run: |
          mkdir -p /tmp/t && tar -xzf dist/sudosend-linux-arm64.tar.gz -C /tmp/t
          /tmp/t/sudosend/install.sh --yes
          ~/.local/bin/sudosend id
          ~/.local/bin/sudosend --uninstall
          sudo apt-get install -y ./dist/sudosend_*_arm64.deb
          sudosend id
      - run: cp sudosend-cli-linux-arm64 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-linux-arm64
          path: dist/*

  windows:
    name: Windows app + CLI
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh flutter build windows --release
      - run: ./tool/ci_run.sh ./tool/build_cli.sh sudosend-cli-windows-x64.exe
      - name: CLI identity is sealed with DPAPI and survives a restart
        run: |
          export APPDATA="$RUNNER_TEMP/appdata"
          ./sudosend-cli-windows-x64.exe id > id1.txt
          ./sudosend-cli-windows-x64.exe id > id2.txt
          cat id1.txt
          grep -q "key storage  dpapi" id1.txt
          diff <(grep fingerprint id1.txt) <(grep fingerprint id2.txt)
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item sudosend-cli-windows-x64.exe dist/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/sudosend-windows-x64-portable.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$pwd\build\windows\x64\runner\Release" "/DCliExe=$pwd\sudosend-cli-windows-x64.exe" "/DOutputDir=$pwd\dist" "/DIconFile=$pwd\windows\runner\resources\app_icon.ico" packaging\windows\sudosend.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=ISCC::installer build failed"; exit 1 }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-windows
          path: dist/*

  macos:
    name: macOS app + CLI
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: PLATFORMS=macos ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh ./tool/apple_pods.sh macos
      - run: ./tool/ci_run.sh flutter build macos --release
      - run: ./tool/ci_run.sh ./tool/build_cli.sh sudosend-cli-macos-arm64
      - name: Package
        run: |
          mkdir -p dist
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -n1)"
          ditto -c -k --keepParent "$app" dist/sudosend-macos.zip
          cp sudosend-cli-macos-arm64 dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-macos
          path: dist/*

  ios:
    name: iOS (unsigned IPA)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: PLATFORMS=ios ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh ./tool/apple_pods.sh ios
      - run: ./tool/ci_run.sh flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/sudosend-ios-unsigned.ipa Payload
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-ios
          path: dist/*

  release:
    name: GitHub Release
    # Tag pushes, or any push to main whose pubspec version has no release yet.
    if: github.event_name == 'push'
    needs: [android, linux, linux-arm64, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decide release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SUDOSEND ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Which file do I need?

            | System | File |
            |---|---|
            | Android | `sudosend-android.apk` |
            | Windows 10/11 | `sudosend-windows-x64-setup.exe` (installer) or `…-portable.zip` |
            | Kali / Debian / Ubuntu / Raspberry Pi OS — PC (x86_64) | `sudosend_*_amd64.deb` |
            | Kali / Debian / Ubuntu / Raspberry Pi OS — Raspberry Pi / ARM64 | `sudosend_*_arm64.deb` |
            | Any other Linux | `sudosend-linux-x64.tar.gz` or `sudosend-linux-arm64.tar.gz` → `./install.sh` |
            | macOS 11+ (Apple Silicon & Intel) | `sudosend-macos.zip` |
            | iPhone / iPad (sideload) | `sudosend-ios-unsigned.ipa` |
            | CLI only | `sudosend-cli-*` |

            Not sure about your CPU on Linux? Run `uname -m`: `x86_64` → x64/amd64, `aarch64` → arm64.

            Full install guide: [README](https://github.com/${{ github.repository }}#install)

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test & CLI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh flutter analyze --no-fatal-infos
      - run: ./tool/ci_run.sh flutter test
      - name: Build CLI
        run: ./tool/ci_run.sh ./tool/build_cli.sh sudosend-cli
      - name: CLI end-to-end over loopback (folder + file + resume-safe naming)
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          XDG_CONFIG_HOME=$T/bob ./sudosend-cli id --name ci-bob
          XDG_CONFIG_HOME=$T/bob ./sudosend-cli receive --dir $T/inbox --yes --once > $T/receive.log 2>&1 &
          RX=$!
          sleep 3
          XDG_CONFIG_HOME=$T/alice ./sudosend-cli send README.md lib --to 127.0.0.1
          wait $RX
          cat $T/receive.log
          cmp README.md $T/inbox/README.md
          diff -r lib $T/inbox/lib
          XDG_CONFIG_HOME=$T/bob ./sudosend-cli receive --dir $T/inbox --yes --once > $T/receive2.log 2>&1 &
          RX=$!
          sleep 3
          XDG_CONFIG_HOME=$T/alice ./sudosend-cli send --text "hello from CI 🔐" --to 127.0.0.1
          wait $RX
          grep -q "hello from CI" $T/receive2.log
          echo "CLI E2E passed"

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
      - name: Pre-install NDK
        run: ./tool/install_ndk.sh
      - run: ./tool/ci_run.sh flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk sudosend-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-android
          path: sudosend-android.apk

  linux:
    name: Linux app + CLI
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh flutter build linux --release
      - run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/sudosend
          tar -czf sudosend-linux-x64.tar.gz -C build/linux/x64/release sudosend
          ./tool/build_cli.sh sudosend-cli-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-linux
          path: |
            sudosend-linux-x64.tar.gz
            sudosend-cli-linux-x64

  windows:
    name: Windows app + CLI
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/ci_run.sh ./tool/bootstrap.sh
      - run: ./tool/ci_run.sh flutter build windows --release
      - run: ./tool/ci_run.sh ./tool/build_cli.sh sudosend-cli-windows-x64.exe
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sudosend-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sudosend-windows
          path: |
            sudosend-windows-x64.zip
            sudosend-cli-windows-x64.exe

  release:
    name: GitHub Release
    # Tag pushes, or any push to main whose pubspec version has no release yet.
    if: github.event_name == 'push'
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decide release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SUDOSEND ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Downloads**
            - `sudosend-android.apk` — Android 5.0+ (debug-signed)
            - `sudosend-windows-x64.zip` — unzip and run `sudosend.exe`
            - `sudosend-linux-x64.tar.gz` — extract and run `sudosend/sudosend`
            - `sudosend-cli-linux-x64`, `sudosend-cli-windows-x64.exe` — standalone CLI

            Protocol: [PROTOCOL.md](https://github.com/${{ github.repository }}/blob/main/PROTOCOL.md)
